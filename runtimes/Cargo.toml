[package]
name = "hipp-runtimes"
version = "0.16.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Examples of driving hipp from async runtimes: tokio, smol and embassy. A separate crate so the core keeps zero dependencies, dev-dependencies included."

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-std", "executor-thread"] }
embassy-futures = "0.1.2"
hipp = { path = ".." }
smol = "2.0.2"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
