[package]
name = "hipp-cli"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
description = "Command-line shell for hipp, the little no_std database that reads and writes SQLite database files. Its first job is differential testing against the pinned SQLite oracle CLI."

[[bin]]
name = "hipp"
path = "src/main.rs"

[dependencies]
hipp = { path = ".." }
