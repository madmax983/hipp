# Tiny-profile size ratchet (SPEC §4.1). Measured by ci/size_gate.py on
#   cargo build --profile tiny --target thumbv7em-none-eabihf \
#     --no-default-features --bin hipp_thumb_demo
# with the toolchain pinned in rust-toolchain.toml.
#
# Ratchet rule: CI fails if the measured size exceeds `ratchet`. When a
# change shrinks the build, lower `ratchet` in the same commit (CI prints
# the new figure). Raising it is a reviewed, justified diff — growth past
# `justify_over` bytes in one change needs a STATUS.md justification.

[tiny]
# .text + .rodata, bytes.
# +828 B (Bolt): table-leaf insert fast path in btree_insert.
ratchet = 76952
# Hard gate (SPEC §4.1): 128 KiB.
budget = 131072
# Engine statics (.data + .bss, minus the demo's caller-supplied heap).
statics_budget = 8192
justify_over = 4096

[full]
# The full no_std profile (`--no-default-features --features full`),
# same target, profile and binary. Tracked so dialect growth is a
# visible, reviewed number; the tiny profile is the one SPEC §4.1 binds.
# 476,476 -> 476,692 (Bolt): +216 B for the exact f64 fast path in
# int_pow10_to_f64 (-7.6% instructions on bolt_workload); gated on
# `query`, so the tiny profile is unchanged.
# +776 B (Bolt): table-leaf insert fast path in btree_insert.
# 476,476 -> 476,492 (v0.17 vm_joins review fix, ungated correctness:
# GROUP BY + ORDER BY + LIMIT kept the wrong groups; `group_cap` now
# asks `groups_sorted`, the pin's `orderByGrp` rule). STATUS.md.
# Merged with main (Bolt, PRs #21/#22): measured 477,484, the sum
# of both raises.
# 477,484 -> 477,788 (v0.17 vm_flip review fixes, ungated correctness;
# STATUS.md): +304 B. A repeated min() / max() no longer moves the
# bare-column rule's choice (`rep_minmax` skips an aggregate equal to
# an earlier one, the pin's one AggInfo entry each: a silent wrong
# answer). (`vm_flip` itself delivered nothing: with the VM as the
# only SELECT path no profile shrinks, so every ratchet stays up.)
# 477,788 -> 478,020 (v0.17 vm_flip retry review fix, ungated correctness;
# STATUS.md): +232 B. A REAL compound column read through a FROM
# subquery / view / CTE (and a recursive CTE's queue) reads other
# cores' integers as reals (`SubPlan::real_cols`, the pin's
# OP_RealAffinity: a silent wrong answer); the compound affinity
# searches for the first core with one. (The flip itself was not
# taken: its probe is still over every ratchet.)
# +184 B (Bolt): index_insert reuses the leaf's validated cell spans
# (-7.0% instructions on bolt_workload).
# Merged with main (Bolt, PR #24): measured 478,220, the sum of
# both raises +16 B of alignment padding.
# 478,220 -> 478,212 (v0.17 sync_readers review fix, ungated: TEMP writes
# and queries over temp tables reading generate_series / dbstat /
# pragma functions; STATUS.md): -8 B. The PRAGMA / REINDEX / ANALYZE
# routing's two copies of the `temp.` cut became one, paying for it.
ratchet = 478212
budget = 524288
statics_budget = 8192
justify_over = 16384

[max]
# Every feature without `std` (`--no-default-features --features max`,
# ADR 0002): `full` plus the leaves too large for `full`'s budget.
# Same target, profile and binary; ratcheted like the others.
# 962,292 -> 962,300 (v0.17 feature rename, ADR 0006): +8 B of
# inter-function alignment padding only. Every symbol keeps its size
# (sum of `llvm-nm -S` sizes unchanged); the new feature names change
# the crate's metadata hash, hence the mangled names and rustc's item
# order. A pure mechanical rename of 3bc670b measures the same.
# 962,300 -> 962,484 (Bolt): +184 B, the int_pow10_to_f64 fast path.
# +752 B (Bolt): table-leaf insert fast path in btree_insert.
# 962,300 -> 962,628 (v0.17 vm_joins review fix, same fix: the access
# planner's `WHERE_SORTBYGROUP` re-check reads an index delivering the
# groups in the ORDER BY's direction). STATUS.md.
# Merged with main (Bolt, PRs #21/#22): measured 963,572, the sum of
# both raises +8 B of alignment padding.
# 963,572 -> 964,076 (v0.17 vm_flip review fixes, ungated
# correctness; STATUS.md): +504 B — the repeated min() / max() fix
# above, and an enclosing query's aggregate a nested query uses as an
# index or rowid bound is substituted into the nested plan's access
# path too (`walk_access_aggs_mut`; it failed with MisusedAggregate).
# 964,076 -> 964,684 (v0.17 vm_flip retry review fix, ungated correctness;
# STATUS.md): +608 B. A REAL compound column read through a FROM
# subquery / view / CTE (and a recursive CTE's queue) reads other
# cores' integers as reals (`SubPlan::real_cols`, the pin's
# OP_RealAffinity: a silent wrong answer); the compound affinity
# searches for the first core with one. (The flip itself was not
# taken: its probe is still over every ratchet.)
# +24 B (Bolt): index_insert reuses the leaf's validated cell spans
# (-7.0% instructions on bolt_workload).
# Merged with main (Bolt, PR #24): measured 964,708, the sum of both raises.
# 964,708 -> 964,684 (v0.17 sync_readers review fix, ungated: TEMP writes
# and queries over temp tables reading generate_series / dbstat /
# pragma functions; STATUS.md): -24 B. The PRAGMA / REINDEX / ANALYZE
# routing's two copies of the `temp.` cut became one, paying for it.
ratchet = 964684
budget = 1048576
statics_budget = 8192
justify_over = 32768

